<!DOCTYPE html>
<html lang="es" data-cvd="off">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escritorio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Filtros SVG para simular daltonismo (se activan desde styles.css) -->
  <svg class="filtros" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <filter id="cvd-protanopia" color-interpolation-filters="linearRGB">
        <feColorMatrix type="matrix" values="0.567 0.433 0 0 0  0.558 0.442 0 0 0  0 0.242 0.758 0 0  0 0 0 1 0"/>
      </filter>
      <filter id="cvd-deuteranopia" color-interpolation-filters="linearRGB">
        <feColorMatrix type="matrix" values="0.625 0.375 0 0 0  0.7 0.3 0 0 0  0 0.3 0.7 0 0  0 0 0 1 0"/>
      </filter>
      <filter id="cvd-tritanopia" color-interpolation-filters="linearRGB">
        <feColorMatrix type="matrix" values="0.95 0.05 0 0 0  0 0.433 0.567 0 0  0 0.475 0.525 0 0  0 0 0 1 0"/>
      </filter>
      <filter id="cvd-acromatopsia" color-interpolation-filters="linearRGB">
        <feColorMatrix type="matrix" values="0.299 0.587 0.114 0 0  0.299 0.587 0.114 0 0  0.299 0.587 0.114 0 0  0 0 0 1 0"/>
      </filter>
    </defs>
  </svg>

  <!-- Iconos (estilo línea, como Breeze) -->
  <svg class="filtros" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-notepad" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 12h7M9 15.5h7M9 8.5h3"/></symbol>
      <symbol id="i-calc" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8v3H8zM8.5 14h1M12 14h1M15.5 14h0M8.5 17.5h1M12 17.5h1M15.5 17h0v1.5"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></symbol>
      <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M2.5 9a15 15 0 0 1 19 0M5.5 12.5a10.5 10.5 0 0 1 13 0M8.8 16a6 6 0 0 1 6.4 0"/><circle cx="12" cy="19.2" r="1" fill="currentColor"/></symbol>
      <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></symbol>
      <symbol id="i-bt" viewBox="0 0 24 24"><path d="M7 7.5l10 9-5 4.5V3l5 4.5-10 9"/></symbol>
      <symbol id="i-battery" viewBox="0 0 24 24"><rect x="3" y="7.5" width="16" height="9" rx="2"/><path d="M21 10.5v3"/><rect x="5.5" y="10" width="9" height="4" rx=".6" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M16 16l4.5 4.5"/></symbol>
      <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3v8M7 6.5a8 8 0 1 0 10 0"/></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></symbol>
    </defs>
  </svg>

  <div class="pantalla" id="pantalla">

    <div class="fondo" aria-hidden="true">
      <span class="fondo__forma fondo__forma--a"></span>
      <span class="fondo__forma fondo__forma--b"></span>
      <span class="fondo__forma fondo__forma--c"></span>
    </div>

    <main class="escritorio">
      <!-- escritorio limpio: sin iconos fijos -->
    </main>

    <!-- Menú de aplicaciones (Kickoff) -->
    <section class="popup menu-inicio" id="menu-inicio" hidden aria-label="Menú de aplicaciones">
      <label class="buscador">
        <svg class="ico" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#i-search"/></svg>
        <input type="search" id="buscar" placeholder="Buscar aplicaciones…" aria-label="Buscar aplicaciones">
      </label>
      <p class="popup__titulo">Aplicaciones</p>
      <div id="apps-lista" class="apps-lista">
        <p class="popup__estado" id="apps-cargando">Cargando aplicaciones…</p>
      </div>
      <p class="vacio" id="sin-resultados" hidden>No hay resultados</p>
      <div class="menu-inicio__pie">
        <span>AppxionOS</span>
        <button type="button" class="boton-icono" id="boton-power" aria-label="Energía" title="Opciones de energía"><svg class="ico" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#i-power"/></svg></button>
      </div>
    </section>

    <!-- Energía -->
    <section class="popup popup-power" id="popup-power" hidden aria-label="Opciones de energía">
      <p class="popup__titulo">Energía</p>
      <button type="button" class="item item-power" data-action="logout">
        <span class="item__icono item__icono--red"><svg class="ico" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#i-eye"/></svg></span>
        <span>Cerrar sesión</span>
      </button>
      <button type="button" class="item item-power" data-action="restart">
        <span class="item__icono item__icono--red"><svg class="ico" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#i-calc"/></svg></span>
        <span>Reiniciar</span>
      </button>
      <button type="button" class="item item-power" data-action="shutdown">
        <span class="item__icono item__icono--red"><svg class="ico" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#i-power"/></svg></span>
        <span>Apagar</span>
      </button>
    </section>

    <!-- Accesibilidad: filtro de daltonismo -->
    <section class="popup popup-acc" id="popup-acc" hidden aria-label="Accesibilidad">
      <p class="popup__titulo">Accesibilidad</p>
      <div class="fila">
        <span>Filtro de daltonismo</span>
        <button type="button" class="interruptor" id="toggle-daltonismo" aria-pressed="false" aria-label="Filtro de daltonismo">
          <span class="interruptor__bola"></span>
        </button>
      </div>
      <div class="fila">
        <label for="tipo-daltonismo">Tipo</label>
        <select id="tipo-daltonismo" class="selector">
          <option value="protanopia">Protanopía</option>
          <option value="deuteranopia">Deuteranopía</option>
          <option value="tritanopia">Tritanopía</option>
          <option value="acromatopsia">Acromatopsia</option>
        </select>
      </div>
      <p class="popup__estado" id="estado-daltonismo">Filtro: NO</p>
    </section>

    <!-- Wi-Fi -->
    <section class="popup popup-wifi" id="popup-wifi" hidden aria-label="Redes Wi-Fi">
      <p class="popup__titulo">Redes Wi-Fi</p>
      <div id="wifi-lista"><p class="popup__estado">Buscando redes…</p></div>
    </section>

    <!-- Volumen -->
    <section class="popup popup-vol" id="popup-vol" hidden aria-label="Volumen">
      <p class="popup__titulo">Volumen</p>
      <div class="fila">
        <svg class="ico" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#i-volume"/></svg>
        <input type="range" id="vol" min="0" max="100" value="70" aria-label="Volumen">
        <b id="vol-val">70%</b>
      </div>
    </section>

    <!-- Calendario -->
    <section class="popup popup-cal" id="popup-cal" hidden aria-label="Calendario">
      <p class="popup__titulo" id="cal-titulo">Calendario</p>
      <div class="cal" id="cal"></div>
    </section>

    <div class="toast" id="toast" role="status" hidden></div>

    <footer class="panel">
      <button type="button" class="panel__inicio" id="boton-inicio" aria-label="Menú de aplicaciones" title="Aplicaciones">
        <svg class="ico" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#i-grid"/></svg>
      </button>


      <div class="bandeja">
        <button type="button" class="bandeja__ico" id="boton-acc" aria-label="Accesibilidad" title="Accesibilidad"><svg class="ico" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#i-eye"/></svg></button>
        <span class="bandeja__ico" title="Bluetooth"><svg class="ico" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#i-bt"/></svg></span>
        <button type="button" class="bandeja__ico" id="boton-wifi" aria-label="Wi-Fi" title="Wi-Fi conectado"><svg class="ico" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#i-wifi"/></svg></button>
        <button type="button" class="bandeja__ico" id="boton-vol" aria-label="Volumen" title="Volumen 70%"><svg class="ico" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#i-volume"/></svg></button>
        <span class="bandeja__ico bandeja__ico--bateria" id="bateria-ico" title="Batería">
          <svg class="ico" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#i-battery"/></svg>
          <span id="bateria-pct" class="bateria-pct"></span>
        </span>
        <button type="button" class="reloj" id="boton-reloj" aria-label="Calendario">
          <b id="reloj-hora">--:--</b>
          <small id="reloj-fecha">--</small>
        </button>
      </div>
    </footer>

  </div>

    <!-- Menú Contextual -->
    <div class="menu-contextual" id="menu-contextual" hidden>
      <button type="button" id="btn-ctx-fondo">
        <svg class="ico" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#i-image"/></svg>
        Cambiar Fondo
      </button>
      <button type="button" id="btn-ctx-usuario">
        <svg class="ico" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#i-eye"/></svg>
        Añadir Usuario
      </button>
    </div>

    <!-- Pantalla de Bloqueo -->
    <div class="pantalla-bloqueo" id="pantalla-bloqueo">
      <div class="login-box" id="login-caja">
        <h2 id="login-titulo">Iniciar Sesión</h2>
        <select id="login-usuario-select" style="display:none"></select>
        <input type="text" id="login-usuario" placeholder="Usuario">
        <input type="password" id="login-password" placeholder="Contraseña">
        <button type="button" id="btn-login">Entrar</button>
        <p class="popup__estado" id="login-error" style="color: #ff8a7a; margin-top: 10px;" hidden></p>
      </div>
    </div>

  <script>
    // --- Pantalla de Bloqueo / Auth ---
    var pantallaBloqueo = document.getElementById('pantalla-bloqueo');
    var loginUsuario = document.getElementById('login-usuario');
    var loginUsuarioSelect = document.getElementById('login-usuario-select');
    var loginPass = document.getElementById('login-password');
    var btnLogin = document.getElementById('btn-login');
    var loginTitulo = document.getElementById('login-titulo');
    var loginError = document.getElementById('login-error');
    var modoCreacion = false;
    var usuarioActual = null;

    function cargarUsuariosLogin() {
      if (window.api && typeof window.api.obtenerUsuarios === 'function') {
        window.api.obtenerUsuarios().then(function(users) {
          if (users && users.length > 0) {
            loginUsuarioSelect.innerHTML = '';
            users.forEach(function(u) {
              var opt = document.createElement('option');
              opt.value = u;
              opt.textContent = u;
              loginUsuarioSelect.appendChild(opt);
            });
            loginUsuarioSelect.style.display = 'block';
            loginUsuario.style.display = 'none';
            loginUsuario.value = users[0];
          } else {
            loginUsuarioSelect.style.display = 'none';
            loginUsuario.style.display = 'block';
          }
        });
      }
    }

    loginUsuarioSelect.addEventListener('change', function() {
      loginUsuario.value = loginUsuarioSelect.value;
    });

    if (window.api && typeof window.api.autenticar === 'function') {
      window.api.autenticar('', '').then(function(res) {
        if (res.noUsers) {
          modoCreacion = true;
          loginTitulo.textContent = 'Crear Usuario Principal';
          btnLogin.textContent = 'Crear y Entrar';
          loginUsuarioSelect.style.display = 'none';
          loginUsuario.style.display = 'block';
        } else {
          cargarUsuariosLogin();
        }
      });
    } else {
      pantallaBloqueo.hidden = true;
    }

    btnLogin.addEventListener('click', function() {
      var u = loginUsuario.style.display !== 'none' ? loginUsuario.value.trim() : loginUsuarioSelect.value.trim();
      var p = loginPass.value.trim();
      if (!u || !p) {
        loginError.textContent = 'Llena ambos campos.';
        loginError.hidden = false;
        return;
      }
      if (modoCreacion) {
        window.api.crearUsuario(u, p).then(function(ok) {
          if (ok) {
            usuarioActual = u;
            cargarFondoPersonalizado();
            pantallaBloqueo.style.opacity = '0';
            setTimeout(function() { pantallaBloqueo.hidden = true; }, 500);
            avisar('Usuario guardado');
          } else {
            loginError.textContent = 'Error al crear usuario.';
            loginError.hidden = false;
          }
        });
      } else {
        window.api.autenticar(u, p).then(function(res) {
          if (res.ok) {
            usuarioActual = u;
            cargarFondoPersonalizado();
            pantallaBloqueo.style.opacity = '0';
            setTimeout(function() { pantallaBloqueo.hidden = true; }, 500);
          } else {
            loginError.textContent = 'Credenciales incorrectas.';
            loginError.hidden = false;
          }
        });
      }
    });

    // --- Menú Contextual ---
    var menuCtx = document.getElementById('menu-contextual');
    document.addEventListener('contextmenu', function(e) {
      if (e.target.closest('.fondo') || e.target.classList.contains('escritorio')) {
        e.preventDefault();
        menuCtx.style.left = e.pageX + 'px';
        menuCtx.style.top = e.pageY + 'px';
        menuCtx.hidden = false;
      } else {
        menuCtx.hidden = true;
      }
    });
    document.addEventListener('click', function(e) {
      if (!e.target.closest('#menu-contextual')) {
        menuCtx.hidden = true;
      }
    });
    
    document.getElementById('btn-ctx-fondo').addEventListener('click', function() {
      menuCtx.hidden = true;
      llamarSeleccionarFondo();
    });
    document.getElementById('btn-ctx-usuario').addEventListener('click', function() {
      menuCtx.hidden = true;
      modoCreacion = true;
      loginTitulo.textContent = 'Añadir Nuevo Usuario';
      btnLogin.textContent = 'Crear';
      loginUsuario.value = '';
      loginPass.value = '';
      loginUsuarioSelect.style.display = 'none';
      loginUsuario.style.display = 'block';
      loginError.hidden = true;
      pantallaBloqueo.style.opacity = '1';
      pantallaBloqueo.hidden = false;
    });

    // --- Lanzador dinámico de aplicaciones del sistema ---
    var todasLasApps = []; // cache de apps cargadas
    var appsYaCargadas = false;

    // Genera el icono SVG genérico para apps sin icono
    function iconoGenerico() {
      return '<svg class="ico" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#i-grid"/></svg>';
    }

    // Genera HTML de spinner de carga para el icono
    function iconoCargando() {
      return '<span class="app-icon-loading" aria-hidden="true"></span>';
    }

    // Renderiza la lista de apps (filtrada o completa)
    function renderizarApps(apps) {
      var lista = document.getElementById('apps-lista');
      var sinResultados = document.getElementById('sin-resultados');
      if (!lista) return;

      if (apps.length === 0) {
        lista.innerHTML = '';
        sinResultados.hidden = false;
        return;
      }
      sinResultados.hidden = true;

      var html = '';
      apps.forEach(function(app) {
        var cats = (app.categories || '').split(';').filter(Boolean);
        var desc = app.genericName || app.comment || (cats.length ? cats[0] : '');
        var execEscapado = (app.exec || '').replace(/"/g, '&quot;').replace(/'/g, '&#39;');

        // Icono: si ya tenemos dataUrl cargado usarlo; si no, placeholder
        var iconHtml;
        if (app._iconDataUrl) {
          iconHtml = '<img src="' + app._iconDataUrl + '" width="32" height="32" alt="" class="app-icon-img" />';
        } else {
          iconHtml = iconoCargando();
        }

        html += '<button type="button" class="item" data-app-id="' + app.id + '" data-app-exec="' + execEscapado + '">' +
          '<span class="item__icono">' + iconHtml + '</span>' +
          '<span>' + app.name + (desc ? '<small>' + desc + '</small>' : '') + '</span>' +
          '</button>';
      });
      lista.innerHTML = html;

      // Cargar íconos reales de forma lazy (por lotes para no saturar IPC)
      cargarIconosLazy(apps);
    }

    // Carga íconos reales en segundo plano por lotes de 5 peticiones simultáneas
    function cargarIconosLazy(apps) {
      if (!window.api || typeof window.api.obtenerIconoApp !== 'function') return;
      var LOTE = 5;
      var pendientes = apps.filter(function(a) { return !a._iconDataUrl; });
      var idx = 0;

      function procesarLote() {
        if (idx >= pendientes.length) return;
        var lote = pendientes.slice(idx, idx + LOTE);
        idx += LOTE;
        var promesas = lote.map(function(app) {
          return window.api.obtenerIconoApp(app.id, app.execPath || '').then(function(dataUrl) {
            app._iconDataUrl = dataUrl || null;
            // Actualizar el botón en el DOM si existe
            var btn = document.querySelector('[data-app-id="' + app.id + '"] .item__icono');
            if (btn) {
              if (dataUrl) {
                btn.innerHTML = '<img src="' + dataUrl + '" width="32" height="32" alt="" class="app-icon-img" />';
              } else {
                btn.innerHTML = iconoGenerico();
              }
            }
          }).catch(function() {
            app._iconDataUrl = null;
            var btn = document.querySelector('[data-app-id="' + app.id + '"] .item__icono');
            if (btn) btn.innerHTML = iconoGenerico();
          });
        });
        Promise.all(promesas).then(procesarLote);
      }

      procesarLote();
    }
    
    // Delegación de eventos para la lista de aplicaciones (optimización de memoria)
    document.getElementById('apps-lista').addEventListener('click', function(e) {
      var btn = e.target.closest('[data-app-id]');
      if (!btn) return;
      var id = btn.dataset.appId;
      var execCmd = btn.dataset.appExec;
      lanzarApp(id, execCmd);
      cerrarPopups();
    });

    // Lanzar app del sistema
    function lanzarApp(desktopId, execCmd) {
      // Buscar nombre amigable
      var app = todasLasApps.find(function(a) { return a.id === desktopId; });
      avisar('Abriendo ' + (app ? app.name : desktopId) + '…');
      if (window.api && typeof window.api.lanzarAplicacion === 'function') {
        window.api.lanzarAplicacion(desktopId, execCmd).catch(function(err) {
          console.error(err);
          avisar('Error: ' + (err.message || err));
        });
      } else {
        console.warn('window.api.lanzarAplicacion no disponible');
      }
    }

    // Cargar aplicaciones desde el proceso principal
    function cargarApps() {
      if (appsYaCargadas) return;
      if (!window.api || typeof window.api.obtenerAplicaciones !== 'function') {
        var lista = document.getElementById('apps-lista');
        if (lista) lista.innerHTML = '<p class="popup__estado">API no disponible</p>';
        return;
      }
      window.api.obtenerAplicaciones().then(function(apps) {
        todasLasApps = (apps || []).map(function(app) {
          app._search = (app.name + ' ' + (app.genericName||'') + ' ' + (app.comment||'') + ' ' + (app.categories||'')).toLowerCase();
          return app;
        });
        appsYaCargadas = true;
        var carg = document.getElementById('apps-cargando');
        if (carg) carg.hidden = true;
        renderizarApps(todasLasApps);
      }).catch(function(err) {
        var lista = document.getElementById('apps-lista');
        if (lista) lista.innerHTML = '<p class="popup__estado">Error: ' + (err.message || err) + '</p>';
      });
    }

    // Cargar apps cuando se abre el menú por primera vez
    document.getElementById('boton-inicio').addEventListener('click', function() {
      setTimeout(function() {
        if (!document.getElementById('menu-inicio').hidden) cargarApps();
      }, 50);
    });

    // Lanzador genérico para los iconos del escritorio (data-program) — mantenido por
    // compatibilidad con posibles accesos directos dinámicos futuros.
    function lanzar(nombre) {
      avisar('Abriendo ' + nombre + '…');
      if (window.api && typeof window.api.ejecutarPrograma === 'function') {
        window.api.ejecutarPrograma(nombre).catch(function(err) {
          console.error(err);
          avisar('Error: ' + (err.message || err));
        });
      }
    }
    document.querySelectorAll('[data-program]').forEach(function(boton) {
      boton.addEventListener('click', function() {
        lanzar(boton.dataset.program);
        cerrarPopups();
      });
    });

    // --- Función para cambiar el fondo de pantalla (reutilizable) ---
    function llamarSeleccionarFondo() {
      if (window.api && typeof window.api.seleccionarImagen === 'function') {
        window.api.seleccionarImagen().then(function(url) {
          if (url) {
            if (window.api && typeof window.api.guardarConfiguracion === 'function') {
              window.api.guardarConfiguracion(usuarioActual, { fondoPantalla: url }).catch(function(e){
                console.error('No se pudo guardar la config', e);
              });
            }
            aplicarFondo(url);
            avisar('Fondo actualizado');
          }
        }).catch(function() {
          avisar('Error al seleccionar imagen');
        });
      } else {
        avisar('API no disponible para seleccionar imagen');
      }
    }


    // --- Aviso emergente ---
    var toast = document.getElementById('toast');
    var temporizador;
    function avisar(texto) {
      toast.textContent = texto;
      toast.hidden = false;
      clearTimeout(temporizador);
      temporizador = setTimeout(function () { toast.hidden = true; }, 2200);
    }

    // --- Popups (solo uno abierto a la vez) ---
    var popups = [
      ['boton-inicio', 'menu-inicio'], ['boton-acc', 'popup-acc'], ['boton-wifi', 'popup-wifi'],
      ['boton-vol', 'popup-vol'], ['boton-reloj', 'popup-cal'], ['boton-power', 'popup-power']
    ].map(function (ids) {
      return { boton: document.getElementById(ids[0]), panel: document.getElementById(ids[1]) };
    });
    function cerrarPopups() {
      popups.forEach(function (p) { p.panel.hidden = true; p.boton.classList.remove('activo'); });
    }
    popups.forEach(function (p) {
      p.boton.addEventListener('click', function (e) {
        e.stopPropagation();
        var abrir = p.panel.hidden;
        cerrarPopups();
        p.panel.hidden = !abrir;
        p.boton.classList.toggle('activo', abrir);
        if (abrir && p.panel.id === 'menu-inicio') document.getElementById('buscar').focus();
      });
      p.panel.addEventListener('click', function (e) { e.stopPropagation(); });
    });
    document.addEventListener('click', cerrarPopups);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') cerrarPopups(); });

    // --- Acciones de energía ---
    document.querySelectorAll('.item-power').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var accion = btn.dataset.action;
        if (accion === 'logout') {
          cerrarPopups();
          pantallaBloqueo.style.opacity = '1';
          pantallaBloqueo.hidden = false;
          loginPass.value = '';
          loginError.hidden = true;
          modoCreacion = false;
          loginTitulo.textContent = 'Iniciar Sesión';
          btnLogin.textContent = 'Entrar';
          usuarioActual = null;
          cargarUsuariosLogin();
          aplicarFondo(null); // Reset background
        } else {
          if (window.api && typeof window.api.accionEnergia === 'function') {
            window.api.accionEnergia(accion);
          }
        }
      });
    });

    // --- Buscador del menú de aplicaciones ---
    document.getElementById('buscar').addEventListener('input', function(e) {
      var q = e.target.value.trim().toLowerCase();
      if (!appsYaCargadas) return;
      if (!q) {
        renderizarApps(todasLasApps);
        return;
      }
      var filtradas = todasLasApps.filter(function(app) {
        return app._search.indexOf(q) !== -1;
      });
      renderizarApps(filtradas);
    });


    // --- Volumen ---
    var vol = document.getElementById('vol');
    vol.addEventListener('input', function () {
      document.getElementById('vol-val').textContent = vol.value + '%';
      document.getElementById('boton-vol').title = 'Volumen ' + vol.value + '%';
    });

    // --- Calendario del mes ---
    (function () {
      var hoy = new Date(), y = hoy.getFullYear(), m = hoy.getMonth();
      var titulo = new Date(y, m, 1).toLocaleDateString('es-CO', { month: 'long', year: 'numeric' });
      document.getElementById('cal-titulo').textContent = titulo.charAt(0).toUpperCase() + titulo.slice(1);
      var html = ['L', 'M', 'X', 'J', 'V', 'S', 'D'].map(function (d) { return '<span class="sem">' + d + '</span>'; }).join('');
      var vacios = (new Date(y, m, 1).getDay() + 6) % 7;
      for (var i = 0; i < vacios; i++) html += '<span></span>';
      for (var d = 1, n = new Date(y, m + 1, 0).getDate(); d <= n; d++) {
        html += '<span' + (d === hoy.getDate() ? ' class="hoy"' : '') + '>' + d + '</span>';
      }
      document.getElementById('cal').innerHTML = html;
    })();

    // --- Filtro de daltonismo (CSS: html[data-cvd="..."]) ---
    var html = document.documentElement;
    var toggle = document.getElementById('toggle-daltonismo');
    var tipo = document.getElementById('tipo-daltonismo');
    var estado = document.getElementById('estado-daltonismo');

    function aplicarFiltro() {
      var activo = toggle.getAttribute('aria-pressed') === 'true';
      html.setAttribute('data-cvd', activo ? tipo.value : 'off');
      estado.textContent = 'Filtro: ' + (activo ? 'SÍ' : 'NO');
    }
    toggle.addEventListener('click', function () {
      toggle.setAttribute('aria-pressed', String(toggle.getAttribute('aria-pressed') !== 'true'));
      aplicarFiltro();
    });
    tipo.addEventListener('change', aplicarFiltro);

    // --- Reloj ---
    var hora = document.getElementById('reloj-hora');
    var fecha = document.getElementById('reloj-fecha');
    function actualizarReloj() {
      var d = new Date();
      hora.textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
      fecha.textContent = d.toLocaleDateString('es-CO', { day: 'numeric', month: 'short', year: 'numeric' });
    }
    actualizarReloj();
    setInterval(actualizarReloj, 15000);

    // --- Batería real ---
    var bateriaPct  = document.getElementById('bateria-pct');
    var bateriaIco  = document.getElementById('bateria-ico');

    function traducirEstado(estado) {
      if (!estado) return '';
      var mapa = { Charging: 'Cargando', Discharging: 'Descargando', Full: 'Completa', Unknown: 'Desconocido' };
      return mapa[estado] || estado;
    }

    function actualizarBateria() {
      if (window.api && typeof window.api.obtenerBateria === 'function') {
        window.api.obtenerBateria().then(function(info) {
          var pct = info.porcentaje;
          var label = pct !== null ? pct + '%' : '--';
          bateriaPct.textContent = label;
          var estadoTrad = traducirEstado(info.estado);
          bateriaIco.title = 'Batería ' + label + (estadoTrad ? ' · ' + estadoTrad : '');
          // Clases visuales según nivel
          bateriaIco.classList.remove('bateria--baja', 'bateria--media', 'bateria--alta', 'bateria--cargando');
          if (info.estado === 'Charging') {
            bateriaIco.classList.add('bateria--cargando');
          } else if (pct !== null) {
            if (pct <= 20) bateriaIco.classList.add('bateria--baja');
            else if (pct <= 50) bateriaIco.classList.add('bateria--media');
            else bateriaIco.classList.add('bateria--alta');
          }
        }).catch(function() { bateriaPct.textContent = '?'; });
      }
    }
    actualizarBateria();
    setInterval(actualizarBateria, 30000); // refrescar cada 30 s

    // --- Wi-Fi real ---
    var wifiLista = document.getElementById('wifi-lista');

    function senal2texto(s) {
      if (s >= 75) return 'Señal excelente';
      if (s >= 50) return 'Señal buena';
      if (s >= 25) return 'Señal débil';
      return 'Señal muy débil';
    }

    function actualizarWifi() {
      if (!window.api || typeof window.api.obtenerWifi !== 'function') {
        wifiLista.innerHTML = '<p class="popup__estado">API no disponible</p>';
        return;
      }
      wifiLista.innerHTML = '<p class="popup__estado">Buscando redes…</p>';
      window.api.obtenerWifi().then(function(res) {
        if (!res.redes || res.redes.length === 0) {
          wifiLista.innerHTML = '<p class="popup__estado">' +
            (res.error ? 'Error: ' + res.error : 'No se encontraron redes') + '</p>';
          return;
        }
        var html = '';
        res.redes.forEach(function(red) {
          var clsItem = 'item' + (red.conectada ? ' item--activa' : '');
          var info = (red.conectada ? 'Conectado · ' : '') + senal2texto(red.senal);
          if (red.seguridad && red.seguridad !== 'Abierta' && red.seguridad !== '--') {
            info += ' · Protegida';
          } else if (!red.seguridad || red.seguridad === '--') {
            info += ' · Abierta';
          }
          html += '<button type="button" class="' + clsItem + '">' +
            '<span class="item__icono item__icono--red">' +
            '<svg class="ico" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#i-wifi"/></svg>' +
            '</span>' +
            '<span>' + red.ssid + '<small>' + info + '</small></span>' +
            '</button>';
        });
        wifiLista.innerHTML = html;
      }).catch(function(err) {
        wifiLista.innerHTML = '<p class="popup__estado">Error: ' + err.message + '</p>';
      });
    }

    // Cargar WiFi cada vez que se abre el popup
    document.getElementById('boton-wifi').addEventListener('click', function() {
      // Solo si el popup se acaba de abrir (hidden ya fue cambiado por el handler general)
      setTimeout(function() {
        if (!document.getElementById('popup-wifi').hidden) actualizarWifi();
      }, 50);
    });

    // --- Cambiar fondo de pantalla ---
    var fondoEl = document.querySelector('.fondo');
    function aplicarFondo(url) {
      if (url) {
        fondoEl.style.backgroundImage = 'url("' + url + '")';
        fondoEl.style.backgroundSize = 'cover';
        fondoEl.style.backgroundPosition = 'center';
        // Ocultar las formas abstractas originales si hay imagen
        fondoEl.querySelectorAll('.fondo__forma').forEach(function(el) { el.style.display = 'none'; });
      } else {
        fondoEl.style.backgroundImage = '';
        fondoEl.querySelectorAll('.fondo__forma').forEach(function(el) { el.style.display = ''; });
      }
    }
    
    function cargarFondoPersonalizado() {
      if (window.api && typeof window.api.obtenerConfiguracion === 'function') {
        window.api.obtenerConfiguracion(usuarioActual).then(function(config) {
          if (config && config.fondoPantalla) {
            aplicarFondo(config.fondoPantalla);
          } else {
            aplicarFondo(null);
          }
        }).catch(function(e) {
          console.error('Error al obtener la configuración', e);
        });
      }
    }

  </script>

</body>
</html>
